# Fast offline checks for the PII bake-off in pii/bakeoff/.
# Standard library only: no pip install, no model download, no network use
# beyond checking out the repository.
name: pii-bakeoff

on:
  push:
    branches: [main]
    paths: ["pii/bakeoff/**", ".github/workflows/pii-bakeoff.yml"]
  pull_request:
    paths: ["pii/bakeoff/**", ".github/workflows/pii-bakeoff.yml"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Generator is deterministic and matches the committed dataset
        run: python pii/bakeoff/generate.py --check
      - name: Scorer self-check
        run: python pii/bakeoff/score.py --self-check
      - name: Regex baseline on the fixed dataset
        run: python pii/bakeoff/run.py --adapters regex --out "$RUNNER_TEMP/bakeoff" --bootstrap 200
      - name: Unit tests
        run: python -m unittest discover -s pii/bakeoff/tests -v
